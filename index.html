<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Próximamente</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=Share+Tech+Mono&display=swap">
<style>
  /* Layout: HUD de una pantalla. Barra de estado arriba, anillos giratorios con el texto al centro, barra de carga abajo. */
  :root {
    --bg: #020a12;
    --cyan: #35e6ff;
    --cyan-dim: #15677a;
    --fg: #d8f8ff;
    --grid: rgba(53, 230, 255, 0.07);
    --font-display: "Orbitron", "Eurostile", "Arial Black", sans-serif;
    --font-mono: "Share Tech Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-block: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    color: var(--fg);
    font-family: var(--font-mono);
    background-color: var(--bg);
    background-image:
      radial-gradient(ellipse at center, rgba(53, 230, 255, 0.12) 0%, rgba(2, 10, 18, 0) 62%),
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 100% 100%, 40px 40px, 40px 40px;
    overflow: hidden;
  }
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.18) 0, rgba(0, 0, 0, 0.18) 1px, transparent 1px, transparent 3px);
  }

  .readout {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    font-size: 0.8rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--cyan);
  }
  .readout span { min-width: 0; }
  .dot {
    display: inline-block;
    width: 8px; height: 8px;
    margin-right: 8px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 10px var(--cyan);
    animation: blink 1.6s ease-in-out infinite;
  }

  .stage {
    position: relative;
    flex: 1;
    min-height: 0;
    display: grid;
    place-items: center;
    border: 1px solid var(--cyan-dim);
  }
  .stage::before, .stage::after {
    content: "";
    position: absolute;
    width: 22px; height: 22px;
    border: 2px solid var(--cyan);
    filter: drop-shadow(0 0 6px var(--cyan));
  }
  .stage::before { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
  .stage::after { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }

  .rings {
    position: absolute;
    top: 50%; left: 50%;
    width: min(94%, 84vh, 760px);
    aspect-ratio: 1;
    max-width: 100%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    overflow: visible;
  }
  .rings circle {
    fill: none;
    transform-box: fill-box;
    transform-origin: center;
  }
  .r1 { stroke: var(--cyan-dim); stroke-width: 2; stroke-dasharray: 2 10; animation: spin 80s linear infinite; }
  .r2 { stroke: var(--cyan); stroke-width: 3; stroke-dasharray: 150 40 30 40; animation: spin 40s linear infinite reverse; filter: drop-shadow(0 0 5px var(--cyan)); }
  .r3 { stroke: var(--cyan-dim); stroke-width: 1; }
  .r4 { stroke: var(--cyan); stroke-width: 4; stroke-dasharray: 70 40; animation: spin 25s linear infinite; filter: drop-shadow(0 0 6px var(--cyan)); }
  .r5 { stroke: var(--cyan-dim); stroke-width: 12; stroke-dasharray: 1 7; animation: spin 60s linear infinite reverse; }

  .core {
    position: relative;
    z-index: 1;
    min-width: 0;
    max-width: 100%;
    padding-inline: 8px;
    text-align: center;
  }
  h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(1.3rem, 7.6vw, 6.4rem);
    line-height: 1.1;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    white-space: nowrap;
    color: var(--fg);
    text-shadow: 0 0 6px var(--cyan), 0 0 22px var(--cyan), 0 0 48px rgba(53, 230, 255, 0.5);
    animation: flicker 6s linear infinite;
  }
  .sub {
    margin: 14px 0 0;
    font-size: clamp(0.7rem, 2.4vw, 1rem);
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--cyan);
  }

  .load {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 0.8rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--cyan);
  }
  .track {
    flex: 1;
    min-width: 0;
    height: 8px;
    border: 1px solid var(--cyan-dim);
    padding: 1px;
  }
  .fill {
    height: 100%;
    width: 87%;
    background: repeating-linear-gradient(90deg, var(--cyan) 0 6px, transparent 6px 9px);
    box-shadow: 0 0 10px var(--cyan);
    animation: pulse 3s ease-in-out infinite;
  }

  .count {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: clamp(8px, 2vw, 24px);
    max-width: 560px;
    margin: clamp(16px, 3vh, 32px) auto 0;
  }
  .count div {
    padding: 10px 4px;
    border: 1px solid var(--cyan-dim);
    background: rgba(53, 230, 255, 0.05);
  }
  .count b {
    display: block;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(1.3rem, 6vw, 2.6rem);
    font-variant-numeric: tabular-nums;
    color: var(--fg);
    text-shadow: 0 0 12px var(--cyan);
  }
  .count small {
    display: block;
    margin-top: 4px;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--cyan);
  }

  .team {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px 24px;
    font-family: var(--font-display);
    font-weight: 500;
    font-size: clamp(0.75rem, 2.6vw, 1rem);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--fg);
    text-shadow: 0 0 8px var(--cyan);
  }
  .team span {
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .team span::before {
    content: "";
    width: 6px;
    height: 6px;
    background: var(--cyan);
    box-shadow: 0 0 8px var(--cyan);
  }

  .voice {
    align-self: center;
    padding: 8px 16px;
    border: 1px solid var(--cyan);
    background: transparent;
    color: var(--cyan);
    font-family: var(--font-mono);
    font-size: 0.8rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .voice:hover { background: rgba(53, 230, 255, 0.12); }
  .voice:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes blink { 50% { opacity: 0.25; } }
  @keyframes pulse { 50% { opacity: 0.6; } }
  @keyframes flicker {
    0%, 92%, 100% { opacity: 1; }
    93% { opacity: 0.82; }
    94% { opacity: 1; }
    96% { opacity: 0.9; }
  }
  @media (prefers-reduced-motion: reduce) {
    .rings circle, .dot, .fill, h1 { animation: none; }
  }
</style>

<div class="readout">
  <span><i class="dot"></i>Sistema en línea</span>
  <span id="clock">00:00:00</span>
</div>

<main class="stage">
  <svg class="rings" viewBox="0 0 600 600" aria-hidden="true">
    <circle class="r1" cx="300" cy="300" r="290"/>
    <circle class="r2" cx="300" cy="300" r="262"/>
    <circle class="r3" cx="300" cy="300" r="228"/>
    <circle class="r4" cx="300" cy="300" r="200"/>
    <circle class="r5" cx="300" cy="300" r="172"/>
  </svg>
  <div class="core">
    <h1>Próximamente</h1>
    <p class="sub" id="status">Inicializando</p>
    <div class="count" role="timer" aria-label="Tiempo restante para el lanzamiento">
      <div><b id="cd-d">07</b><small>Días</small></div>
      <div><b id="cd-h">07</b><small>Horas</small></div>
      <div><b id="cd-m">00</b><small>Min</small></div>
      <div><b id="cd-s">00</b><small>Seg</small></div>
    </div>
  </div>
</main>

<div class="team" aria-label="Equipo">
  <span>Jonathan</span>
  <span>Agustín</span>
  <span>Dilan</span>
  <span>Iván</span>
</div>

<button class="voice" id="voice" type="button">Activar voz</button>

<div class="load">
  <span>Carga 87%</span>
  <div class="track"><div class="fill"></div></div>
</div>

<script>
  (function () {
    var el = document.getElementById("clock");
    function tick() {
      try {
        el.textContent = new Date().toLocaleTimeString("es-MX", { hour12: false });
      } catch (e) {}
    }
    tick();
    setInterval(tick, 1000);
  })();

  (function () {
    // Lunes 23 de noviembre de 2026, 11:59 pm en Ciudad de México (UTC-6) = 24 nov 05:59 UTC
    var target = Date.UTC(2026, 10, 24, 5, 59, 0);
    var ids = ["cd-d", "cd-h", "cd-m", "cd-s"];
    var status = document.getElementById("status");
    function pad(n) { return (n < 10 ? "0" : "") + n; }
    function update() {
      var left = Math.max(0, Math.floor((target - Date.now()) / 1000));
      var v = [Math.floor(left / 86400), Math.floor((left % 86400) / 3600), Math.floor((left % 3600) / 60), left % 60];
      for (var i = 0; i < ids.length; i++) {
        document.getElementById(ids[i]).textContent = pad(v[i]);
      }
      if (left === 0 && status) status.textContent = "Ya disponible";
    }
    update();
    setInterval(update, 1000);
  })();
